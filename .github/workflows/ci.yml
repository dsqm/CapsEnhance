name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build & run unit tests (word-jump / chord / config)
        shell: cmd
        run: |
          call test\build_nav.bat || exit /b 1
          call test\build_test.bat || exit /b 1

      # Release CRT (/MT) does not validate heap blocks, so "wrote past end of
      # heap buffer" bugs pass the suite silently. This pass runs the config
      # test on the Debug CRT, where such a write aborts at free().
      - name: Debug-CRT pass (heap overflow guard)
        shell: cmd
        run: call test\build_dbg.bat

      - name: Build diagnostic tools
        shell: cmd
        run: call test\build_keytest.bat

      # /W4 only reports what the front end is sure about. /analyze runs the
      # deeper data-flow engine and has already caught real defects in this
      # codebase (Interlocked-vs-plain mixed access on the stop flags, and
      # hand-computed buffer capacities). Remaining findings are documented
      # false positives; this step compiles only, so it is cheap.
      - name: Static analysis (/W4 + /analyze)
        shell: cmd
        run: call test\build_analyze.bat

      # 先编译主程序：restarttest / logsmoke 会用 CreateProcessW 启动
      # bin\CapsEnhance.exe 做真实进程级检查，必须先有它。
      - name: Build release exe
        shell: cmd
        run: call build.bat

      # Records which toolchain produced this exe, plus its size and SHA256.
      # Two machines can build the same source into different sizes simply
      # because MSVC / Windows SDK differ; this file makes that a one-line
      # diff instead of a mystery. build.bat already uses /Brepro, so with the
      # same toolchain the hash is reproducible.
      - name: Record build fingerprint
        shell: cmd
        run: |
          call build_env.bat
          (
            echo toolchain:
            echo   VS   = %VS%
            echo   MSVC = %MSVCDIR%
            echo   SDK  = %SDKVER%
            echo   flags = see build.bat ^(/O2 /W4 /MT /Brepro /TP^)
            echo artifact:
            for %%F in (bin\CapsEnhance.exe) do echo   size   = %%~zF bytes
            certutil -hashfile bin\CapsEnhance.exe SHA256
            for %%F in (bin\CapsEnhanceSettings.exe) do echo settings size = %%~zF bytes
            certutil -hashfile bin\CapsEnhanceSettings.exe SHA256
          ) > bin\BUILD-FINGERPRINT.txt
          type bin\BUILD-FINGERPRINT.txt

      # 真实进程级检查：重启握手 / 单实例 / 日志轮转。
      # windows-latest 是完整交互会话，可运行 GUI 进程。
      - name: Runtime checks (restart handshake / single instance / log rotate)
        shell: cmd
        run: |
          if not exist "bin\CapsEnhance.exe" (
            echo bin\CapsEnhance.exe not found - ensure build.bat ran successfully
            exit /b 1
          )
          obj\test\restarttest.exe || exit /b 1
          obj\test\logsmoke.exe || exit /b 1
          taskkill /IM CapsEnhance.exe /F 2>nul & exit /b 0

      # WPS 通道：编译 + 真机跑一次（把 WPS 窗口置前，直接调 NavJump，
      # 看它是否选中 WPS 通道并按算出的步数移动光标）。
      # runner 上没装 WPS 时该程序打印 [SKIP] 并以 0 退出，不会卡红流水线；
      # 但它的**编译**照常受 /W4 约束 —— 新通道不该悄悄引入告警。
      - name: WPS channel (compile + live check, skips without WPS)
        shell: cmd
        run: call test\build_wpsjump.bat

      # 四个 exe 一起发布：托盘按同目录找 CapsEnhanceSettings.exe，和弦按同目录
      # 拉起 CapsEnhanceHelp.exe / CapsEnhanceClip.exe —— 少带一个就等于那项功能
      # 在用户那里直接不可用。
      - name: Upload exes
        uses: actions/upload-artifact@v5
        with:
          name: CapsEnhance-${{ github.sha }}
          path: |
            bin/CapsEnhance.exe
            bin/CapsEnhanceSettings.exe
            bin/CapsEnhanceHelp.exe
            bin/CapsEnhanceClip.exe
            bin/BUILD-FINGERPRINT.txt
